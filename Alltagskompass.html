<style>
:root{

*{box-sizing:border-box;}
html,body{margin:0;background:#ece3d2;font-family:'EB Garamond',Georgia,serif;color:var(--text);}

// Eingaben werden bewusst NICHT gespeichert - Reset bei jedem Neuladen (Datenschutz)
async function downloadPDF(){
  const btn = document.getElementById('pdfBtn');
  const original = btn.textContent;
  btn.disabled = true;
  const offscreen = document.createElement('div');
  offscreen.style.cssText = 'position:fixed;left:-99999px;top:0;pointer-events:none;';
  document.body.appendChild(offscreen);
  try{
    const pages = Array.from(document.querySelectorAll('#app .page'));
    const { jsPDF } = window.jspdf;
    let pdf;
    for (let i=0; i<pages.length; i++){
      btn.textContent = `PDF wird erstellt (${i+1}/${pages.length})…`;
      const src = pages[i];
      const rect = src.getBoundingClientRect();
      const clone = src.cloneNode(true);
      clone.style.margin = '0';
      clone.style.width = rect.width + 'px';
      // Radios -> statisches, gestaltetes Kästchen (checked-Status bleibt sichtbar)
      clone.querySelectorAll('input[type="radio"]').forEach(r=>{
        const span = document.createElement('span');
        span.className = 'pdf-check' + (r.checked ? ' on' : '');
        r.parentNode.replaceChild(span, r);
      });
      // Text-/Textareafelder -> Text sichtbar als statischer Block
      clone.querySelectorAll('input.field, textarea.field').forEach(f=>{
        const div = document.createElement('div');
        div.className = f.className + ' pdf-field-text';
        div.textContent = f.value && f.value.trim() ? f.value : '\u00A0';
        f.parentNode.replaceChild(div, f);
      });
      offscreen.innerHTML = '';
      offscreen.appendChild(clone);
      await new Promise(r=>setTimeout(r, 60));
      const canvas = await html2canvas(clone, {scale:2, backgroundColor:'#ffffff', useCORS:true});
      const mmW = rect.width * 25.4/96, mmH = rect.height * 25.4/96;
      const orient = mmW > mmH ? 'l' : 'p';
      if(!pdf){ pdf = new jsPDF({unit:'mm', format:[mmW,mmH], orientation:orient, compress:true}); }
      else { pdf.addPage([mmW,mmH], orient); }
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, mmW, mmH);
    }
    document.body.removeChild(offscreen);
    const blob = pdf.output('blob');

    if (typeof claude !== 'undefined' && claude && claude.use) {
      const downloads = await claude.use("downloads");
      if (downloads) {
        await downloads.save({filename: "SEN_SIN_Alltagskompass.pdf", data: blob});
        return;
      }
    }
    // Selbst gehostete Seite: als generischen Dateityp ausliefern, sonst zeigen
    // iOS/Android nur die PDF-Vorschau statt eines echten Downloads.
    const forcedBlob = new Blob([blob], {type: 'application/octet-stream'});
    const blobUrl = URL.createObjectURL(forcedBlob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = "SEN_SIN_Alltagskompass.pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(blobUrl), 4000);
  }catch(e){
    if(offscreen.parentNode) document.body.removeChild(offscreen);
    if(!(e && e.code === 'declined')){ alert('Die PDF konnte nicht erstellt werden. Bitte erneut versuchen.'); }
  }finally{
    btn.disabled = false;
    btn.textContent = original;
  }
}
</script>
</body>
